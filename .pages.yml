# Pages CMS — 页面介绍按页面区域维护；内容与绑定路径保持不变。
components:
  bilingual:
    type: object
    fields:
      - name: zh
        label: 中文文案
        type: text
      - name: en
        label: 英文文案
        type: text
  bilingual-title:
    type: object
    fields:
      - name: zh
        label: 中文
        type: string
      - name: en
        label: 英文
        type: string
  bilingual-copy:
    type: object
    fields:
      - name: zh
        label: 中文
        type: text
      - name: en
        label: 英文
        type: text
media:
  - name: images
    label: 网站图片
    input: images
    output: /images
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - gif
      - svg
    rename: safe
  - name: portraits
    label: 现有成员照片
    input: Fig
    output: /Fig
    extensions:
      - jpg
      - jpeg
      - png
      - webp
    rename: safe
  - name: pdfs
    label: 论文 PDF
    input: pdfs
    output: /pdfs
    extensions:
      - pdf
    rename: safe
content:
  - name: page-introductions
    label: 页面介绍
    type: group
    description: 先选页面，再按页面区域找到对应的标题、正文、配图和链接。
    items:
      - name: index
        label: 首页
        type: group
        description: 按页面从上到下选择要修改的区域。
        items:
          - name: index-hero
            label: 01 顶部首屏
            type: file
            path: content/pages/index.json
            format: json
            description: 官网打开后首先看到的大图、主标题、介绍与两个按钮。
            operations:
              create: false
              delete: false
              rename: false
            commit:
              templates:
                update: "content: update 首页 / 01 顶部首屏"
            fields:
              - name: section_01
                label: 标题与介绍
                type: object
                fields:
                  - name: text_001
                    label: 顶部身份说明
                    component: bilingual-copy
                  - name: text_002
                    label: 主标题
                    component: bilingual-title
                  - name: text_003
                    label: 简短介绍
                    component: bilingual-copy
                  - name: text_004
                    label: 主按钮文字
                    component: bilingual-title
                  - name: text_005
                    label: 次按钮文字
                    component: bilingual-title
              - name: images
                label: 本区域的配图
                type: object
                fields:
                  - name: hero_background
                    label: 首屏背景图
                    type: object
                    fields:
                      - name: src
                        label: 图片文件
                        type: image
                        options:
                          media: images
                      - name: alt_zh
                        label: 图片内容说明（中文）
                        type: string
                      - name: alt_en
                        label: 图片内容说明（英文）
                        type: string
                    description: 选择或上传图片。图片内容说明供阅读辅助工具使用，不是页面下方的可见图注。
          - name: index-intro
            label: 02 实验室简介
