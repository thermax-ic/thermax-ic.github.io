          - name: text_008
            label: 热管理正在成为集成技术的核心约束
            component: bilingual
          - name: text_009
            label: 随着芯片向更高功率密度和更高集成度发展，热问题已经从外部散热进入芯片结构内部。局部热点、层间热耦合、界面热阻和受限的垂直热通路，共同影响芯片的性能、可
            component: bilingual
          - name: text_010
            label: 在2.5D与3D集成系统中，材料选择、互连结构、键合工艺和封装架构同时决定最终热阻。热管理因此成为先进集成技术的重要组成部分。
            component: bilingual
          - name: text_011
            label: 更低的热阻，支持更高的可用功率与计算性能。
