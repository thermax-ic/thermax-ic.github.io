: surface stabilization</tspan></text><text x="75" y="359" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#4a857b" text-anchor="start"><tspan x="75" dy="0">Preferential removal of non-diamond carbon</tspan></text><text x="691" y="510" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#263a49" text-anchor="start"><tspan x="691" dy="0">Prepared, heated substrate</tspan></text><text x="47" y="494" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#60727e" text-anchor="start"><tspan x="47" dy="0">Activation method depends on the reactor</tspan></text></svg>