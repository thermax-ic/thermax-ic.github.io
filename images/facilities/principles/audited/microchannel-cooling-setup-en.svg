, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#263a49" text-anchor="start"><tspan x="200" dy="0">Wall → fluid convection</tspan></text><text x="36" y="532" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#263a49" text-anchor="start"><tspan x="36" dy="0">Q̇ = ṁ cp (Tout − Tin) ;  Hydraulic power = Δp · V̇</tspan></text></svg>